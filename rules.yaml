# Trading rules for signal-trader. Edit here, not in code.

eligibility:
  require_ticker_stated: true        # only trade tickers the speaker actually named
  sentiments: [bullish]              # bearish mentions are logged as skipped, not traded
  confidences: [medium, high]

# Episodes to skip entirely. Their mentions are still logged as skipped, with the reason.
episode_exclusions:
  - podcast_prefix: "Table Four"
    date: "2026-11-20"
    reason: "Table Four 2026-11-20 metadata is wrong, pending fix"

# Position sizing, for every trade in both books. Orders are market orders (time in force DAY).
# Rule: at most $500 in any single stock or ETF. Exception: when at least 2 independent sources back the
# same ticker (3 is better), we double down to $1,000. A "source" is a distinct show or event (podcast
# name); repeat episodes of one show count once. A later source tops up an existing position by the difference.
sizing:
  per_position_cap_usd: 1000         # hard ceiling per ticker, all trades combined
  by_sources: {1: 500, 2: 1000}      # 1 source -> $500; 2 or more sources -> $1,000
  corroboration_window_days: 7       # all corroborating sources must be within a week of each other
  min_order_usd: 50                  # ignore top-ups smaller than this

# Benchmark: for every entry, the SAME DOLLARS go into SPY (hypothetically; never ordered) at the same fill
# time, and are sold when we sell. So our portfolio is compared with e.g. "$3,000 of S&P bought the same day".
benchmark:
  symbol: SPY

# Holding period in trading days. For the one-month test every position is held 60 trading days,
# whatever horizon the speaker gave, so the whole portfolio is one clean test against buying the S&P.
# (The speaker's horizon is still recorded. Original values were short 20 / medium 60 / long 180.)
horizons:
  short: 60
  medium: 60
  long: 60

# Horizons in signals.json are free text ("near term", "2027", "two to three quarters").
# An exact bucket name wins; otherwise the first bucket whose keyword appears is used,
# checked in this order. Nothing matches -> horizon_default.
horizon_keywords:
  short: [short, near, day, week, month]
  medium: [medium, quarter]
  long: [long, year, multi, "202"]
horizon_default: medium

# Market data feed for benchmark prices: iex works on free Alpaca accounts, sip needs a subscription.
data_feed: iex

ticker_aliases: {}                   # e.g. {GOOG.L: GOOGL}; applied after normalization

# Theme logic: turns world events (war, oil, rates, AI build-out...) into stock ideas.
# See universe.yaml for what it may pick from. Theme trades are a separate "book" so their
# results are measured apart from trades on stocks a speaker named.
thematic:
  mode: paper                  # paper = place orders on the Alpaca paper account; shadow = record only
  max_total_usd: 3000          # open theme positions in total
  max_positions_per_theme: 2   # e.g. one ETF + one stock
  max_picks_per_idea: 2
  min_strength: medium         # ideas weaker than this are logged, not traded
  max_age_days: 7              # ignore ideas from episodes older than this when it's time to buy

# Shadow account: every theme idea is tracked as a hypothetical purchase (entry at the next open after
# the episode, exit at its horizon), whether or not the real limits allowed the trade. It measures the
# idea logic itself, and shows whether the limits above help or hurt.
shadow:
  enabled: true
  notional_usd: 500
